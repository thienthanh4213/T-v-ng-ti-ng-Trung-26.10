const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let showPy=st.get("zh-2610-py",true); $("pyToggle").checked=showPy;
$("pyToggle").onchange=e=>{showPy=e.target.checked;st.set("zh-2610-py",showPy)};
function renderHome(){
  const best=st.get(KEY,{}); const box=$("lists"); box.innerHTML="";
  for(let l=1;l<=nLists;l++){
    const ws=V.filter(v=>v.list===l);
    const b=document.createElement("button"); b.className="li";
    const s=best[l];
    b.innerHTML=`<b>List ${String(l).padStart(2,"0")}</b><div class="w zh"></div><span class="best ${s==null?'none':''}">${s==null?'Chưa làm':'Cao nhất: '+s+'/'+ws.length}</span>`;
    b.querySelector(".w").textContent=ws.map(v=>v.h).join(" · ");
    b.onclick=()=>start(l);
    box.appendChild(b);
  }
  show("home");
}
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}
let Q=[],pos=0,score=0,answers=[],cur=null,done=false;
function start(l,items){
  cur=l; Q=shuffle(items||(l==="mix"?shuffle(V).slice(0,10):V.filter(v=>v.list===l)));
  pos=0;score=0;answers=[];
  $("qTitle").textContent=l==="mix"?"Trộn ngẫu nhiên":"List "+String(l).padStart(2,"0");
  show("quiz");render();
}
function distract(c){
  // ưu tiên nhiễu từ cùng list để khó hơn, bổ sung từ list khác nếu cần
  const same=shuffle(V.filter(v=>v!==c&&v.list===c.list)), other=shuffle(V.filter(v=>v.list!==c.list));
  const out=[],seen=new Set([c.v]);
  for(const v of same.concat(other)){if(out.length>=3)break;if(!seen.has(v.v)){seen.add(v.v);out.push(v.v)}}
  return out;
}
function render(){
  if(pos>=Q.length) return finish();
  done=false; const c=Q[pos];
  $("qc").textContent=`${pos+1}/${Q.length}`; $("pf").style.width=(pos/Q.length*100)+"%";
  $("w").textContent=c.h; $("py").textContent=showPy?c.p:"";
  const opts=shuffle([c.v,...distract(c)]); const box=$("opts"); box.innerHTML="";
  opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span class="t"></span>`;b.querySelector(".t").textContent=o;b.onclick=()=>pick(b,o,c);box.appendChild(b)});
  $("fb").textContent="";$("fb").className="fb";$("ex").style.display="none";$("nextBtn").classList.add("hidden");
}
function pick(btn,o,c){
  if(done)return; done=true; const ok=o===c.v; if(ok)score++;
  answers.push({c,given:o,ok});
  [...$("opts").children].forEach(b=>{b.disabled=true;const t=b.querySelector(".t").textContent;if(t===c.v)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
  $("fb").textContent=ok?"✅ Chính xác!":"❌ Chưa đúng — đáp án: "+c.v; $("fb").className="fb "+(ok?"ok":"bad");
  $("py").textContent=c.p;
  const ex=$("ex"); ex.innerHTML=""; [[c.e1,c.p1,c.v1],[c.e2,c.p2,c.v2]].forEach(([e,p,v])=>{const d=document.createElement("div");d.style.margin="4px 0";d.innerHTML=`<span class="zh" style="color:var(--ink)"></span><br><i></i><br><span></span>`;const s=d.querySelectorAll("span,i");s[0].textContent=e;s[1].textContent=p;s[2].textContent=v;ex.appendChild(d)});
  ex.style.display="block";
  $("nextBtn").textContent=pos+1<Q.length?"Câu tiếp →":"Xem kết quả →"; $("nextBtn").classList.remove("hidden");
}
$("nextBtn").onclick=()=>{pos++;render()};
function finish(){
  $("pf").style.width="100%";
  if(typeof cur==="number"){const best=st.get(KEY,{});if(best[cur]==null||score>best[cur])best[cur]=score;st.set(KEY,best)}
  $("rTitle").textContent=$("qTitle").textContent;
  $("rScore").textContent=`${score}/${Q.length}`;
  const pct=score/Q.length; $("rMsg").textContent=pct===1?"🎉 Tuyệt vời, đúng hết!":pct>=.8?"👍 Rất tốt!":pct>=.5?"💪 Ổn rồi, ôn lại các từ sai nhé.":"📚 Ôn lại list này rồi làm lại nhé.";
  const tb=$("rTable"); tb.innerHTML="";
  answers.forEach(a=>{const tr=document.createElement("tr");tr.innerHTML=`<td><span class="zh"></span><br><small style="color:var(--muted)"></small></td><td></td><td></td>`;const td=tr.children;td[0].querySelector(".zh").textContent=a.c.h;td[0].querySelector("small").textContent=a.c.p;td[1].textContent=a.c.v;td[2].textContent=(a.ok?"✓ ":"✗ ")+a.given;td[2].className=a.ok?"r-ok":"r-bad";tb.appendChild(tr)});
  const wrong=answers.filter(a=>!a.ok).map(a=>a.c);
  $("wrongBtn").classList.toggle("hidden",!wrong.length); $("wrongBtn").onclick=()=>start(cur,wrong);
  $("nextListBtn").classList.toggle("hidden",!(typeof cur==="number"&&cur<nLists));
  show("result");
}
$("retryBtn").onclick=()=>start(cur);
$("nextListBtn").onclick=()=>start(cur+1);
$("homeBtn").onclick=renderHome; $("backBtn").onclick=renderHome;
$("mixBtn").onclick=()=>start("mix");
renderHome();
</script></body></html>
